# Management console (v1.1). When enabled, the gateway starts a second
# http.Server on bind_addr that serves the embedded SPA at "/" and the
# control-plane API under "/api/v1/*". HTTP Basic auth protects the API;
# the SPA's static assets are public.
#
# Username is always "admin" (not configurable).
# Password resolution: SLIPSPACE_ADMIN_PASSWORD env var wins if set; otherwise
# the `password` field below is used. Either source is fine for dev; in
# production prefer the env var so the secret stays out of yaml.
#
# Default off — flip enabled to true and (optionally) set a password to
# bring the console up locally. The data-plane listener is unaffected.
admin:
  enabled: true
  bind_addr: "127.0.0.1:8081"
  password: "slipspace-gateway"
