# v2 model: configurations carry credentials (per provider), bindings (the
# router as data — (protocol, models) → provider|group), passthrough bindings,
# and transform rules. The v1 changeProvider/changeUrl/changeApiKey/
# useResiliencePolicy routing actions are gone — routing is bindings now; rules
# are pure request/response transforms (tags, header sets, body rewrites).
#
# Two configurations:
#   1. `dev` — the long-standing fixture the e2e harness drives. The harness
#      hardcodes the api-key secret + configuration name, so this block stays
#      backwards-compatible.
#   2. `production` — a sanitised replica of the cluster policy. Real
#      credentials swapped for *-mock equivalents; binding/provider structure
#      mirrors what runs in the office cluster.
#
# Rule evaluation order is the rule_names list position. Rules condition on the
# resolved provider (provider:), protocol (protocol:), and client model
# (modelName:) — selection runs before rules.

configurations:
  dev:
    credentials:
      openai: sk-dev-mock
      anthropic: sk-ant-dev-mock
      gemini: dev-mock

    bindings:
      - { protocol: chat, models: ["gpt-*", "o1*", "o3*"], provider: openai }
      - { protocol: responses, models: ["gpt-*"], provider: openai }
      - { protocol: chat, models: ["claude-*"], provider: anthropic }
      - { protocol: messages, models: ["claude-*"], provider: anthropic }
      - { protocol: chat, models: ["gemini-*"], provider: gemini }
      - { protocol: generate_content, models: ["gemini-*"], provider: gemini }

    passthrough_bindings:
      - { family: messages_batches, provider: anthropic }
      - { family: models, provider: openai }
      - { family: models, provider: gemini }

    rule_names:
      - tag-openai-chat
      - tag-anthropic-messages
      - tag-large-prompt
      - redact-emails
      - translate-messages-to-chat

    tags:
      tier: dev

  production:
    credentials:
      openai: sk-mock-openai
      anthropic: sk-ant-mock-anthropic
      gemini: gemini-mock
      gpt-oss: ""
      qwen36: ""
      qwen-ollama: ""

    bindings:
      - { protocol: chat, models: ["gpt-oss*"], provider: gpt-oss }
      - { protocol: chat, models: ["qwen3.6*"], provider: qwen36 }
      - { protocol: chat, models: ["qwen2.5-coder:7b"], provider: qwen-ollama }
      - { protocol: chat, models: ["claude-*"], provider: anthropic }
      - { protocol: chat, models: ["gemini-*"], provider: gemini }
      - { protocol: chat, models: ["gpt-*", "o1*", "o3*"], provider: openai }

    rule_names:
      - tag-k3s-agentling
      - gpt-oss-chat
      - gpt-oss-from-messages

    tags:
      tier: production

api_keys:
  - secret: sk_dev_local_development_only_not_for_production
    name: "Local dev"
    configuration: dev
    enabled: true

  - secret: sk_dev_replica_donkeywork_production_local_only
    name: "sluice.donkeywork.dev production (replica)"
    configuration: production
    enabled: true
  - secret: ollama
    name: "bash-enrichment-service (ollama default key)"
    configuration: production
    enabled: true
  - secret: sk_dev_replica_smoke_v106_local_only
    name: "smoke-v106 (replica)"
    configuration: production
    enabled: true

rules:
  - name: tag-openai-chat
    condition:
      type: group
      logicalOperator: And
      children:
        - type: provider
          operator: Equals
          expectedProvider: openai
        - type: protocol
          operator: Equals
          expectedProtocol: chat
    actions:
      - type: addTag
        tag: surface:openai-chat
    behavior: continue

  - name: tag-anthropic-messages
    condition:
      type: group
      logicalOperator: And
      children:
        - type: provider
          operator: Equals
          expectedProvider: anthropic
        - type: protocol
          operator: Equals
          expectedProtocol: messages
    actions:
      - type: addTag
        tag: surface:anthropic-messages
    behavior: continue

  - name: tag-large-prompt
    condition:
      type: header
      keyOperator: Equals
      keyPattern: x-sluice-tag-large
      valueOperator: Equals
      valuePattern: "true"
      caseInsensitive: true
    actions:
      - type: addTag
        tag: audit:large-prompt
    behavior: continue

  - name: tag-k3s-agentling
    condition:
      type: header
      keyOperator: Equals
      keyPattern: X-Agentling-Name
      valueOperator: Equals
      valuePattern: k3s-agentling
      caseInsensitive: true
    actions:
      - type: addTag
        tag: client:k3s-agentling
    behavior: continue

  - name: redact-emails
    condition:
      type: provider
      operator: Equals
      expectedProvider: openai
    actions:
      - type: setHeader
        headerName: X-Sluice-Redacted
        headerAction: Set
        headerValue: emails
    behavior: continue

  # Cross-provider translation, header-gated so it fires only for the
  # wire-compat suite's explicit probe (x-sluice-translate: chat). An inbound
  # Anthropic Messages request carrying that header is translated to the
  # OpenAI Chat protocol and routed to anthropic's chat endpoint; the response
  # is translated back to Messages. Header-gated to keep every other dev
  # request (and the e2e harness) on the native path.
  - name: translate-messages-to-chat
    condition:
      type: header
      keyOperator: Equals
      keyPattern: x-sluice-translate
      valueOperator: Equals
      valuePattern: chat
      caseInsensitive: true
    actions:
      - type: translate
        targetProtocol: chat
    behavior: continue

  # gpt-oss smoke-test models (production config). gpt-oss (Ollama, gpt-oss:20b)
  # serves chat/responses/messages natively and reasons + does tools, so it is a
  # self-validating oracle for translation. Both fake models resolve via the
  # existing `gpt-oss*` bindings; the rules rewrite the body model to the real
  # gpt-oss:20b (and translate for the messages path). See
  # test/smoke/test_gptoss_translate.py.
  - name: gpt-oss-chat
    condition:
      type: modelName
      operator: Equals
      expectedModelName: gpt-oss-chat
    actions:
      - type: changeModelName
        newModelName: "gpt-oss:20b"
    behavior: continue

  - name: gpt-oss-from-messages
    condition:
      type: modelName
      operator: Equals
      expectedModelName: gpt-oss-from-messages
    actions:
      - type: changeModelName
        newModelName: "gpt-oss:20b"
      - type: translate
        targetProtocol: chat
    behavior: continue
