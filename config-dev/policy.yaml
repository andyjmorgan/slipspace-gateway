rules:
  - name: redact-emails
    priority: 100
    condition:
      type: provider
      operator: Equals
      expectedProvider: openai
    actions:
      - type: setHeader
        headerName: X-Sluice-Redacted
        headerAction: Set
        headerValue: emails
    behavior: continue

resilience_policies:
  - name: high-availability
    mode: failover
    timeout_seconds: 30
    targets:
      - provider: openai
        order: 0
      - provider: anthropic
        order: 1
