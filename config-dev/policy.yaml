# Two configurations are loaded here:
#
# 1. `dev` — the long-standing fixture the e2e harness drives. The
#    harness hardcodes the api-key secret and the configuration name,
#    so anything in this block needs to stay backwards-compatible.
#
# 2. `production` — a sanitised replica of the cluster sluice-gateway
#    secret's policy.yaml (office cluster, sluice-gateway namespace).
#    Every real credential has been swapped for a *-mock or
#    sk_dev_replica_* equivalent; structure is verbatim from the
#    cluster so the admin console reflects what's actually running.
#
# Rule evaluation order is the YAML list position in `rule_names` —
# there is no separate priority field. More-specific rules (claude/
# gemini model routing) come first so they short-circuit before the
# coarser ones (provider-equals header injection).

configurations:
  dev:
    upstream_credentials:
      openai: sk-dev-mock
      anthropic: sk-ant-dev-mock
      gemini: dev-mock

    rule_names:
      - tag-openai-chat
      - tag-anthropic-messages
      - tag-large-prompt
      - route-claude-models-to-anthropic
      - route-gemini-models-to-gemini
      - redact-emails

    resilience_name: high-availability

    tags:
      tier: dev

  production:
    upstream_credentials:
      openai: sk-mock-openai
      anthropic: sk-ant-mock-anthropic
      gemini: gemini-mock
      gpt-oss: ""
      qwen36: ""
      qwen-ollama: ""

    rule_names:
      - route-claude-models-to-anthropic
      - route-gemini-models-to-gemini
      - route-gpt-oss
      - route-qwen36
      - route-qwen-ollama

    tags:
      tier: production

api_keys:
  - secret: sk_dev_local_development_only_not_for_production
    name: "Local dev"
    configuration: dev
    enabled: true

  - secret: sk_dev_replica_donkeywork_production_local_only
    name: "sluice.donkeywork.dev production (replica)"
    configuration: production
    enabled: true
  - secret: ollama
    name: "bash-enrichment-service (ollama default key)"
    configuration: production
    enabled: true
  - secret: sk_dev_replica_smoke_v106_local_only
    name: "smoke-v106 (replica)"
    configuration: production
    enabled: true

rules:
  - name: tag-openai-chat
    condition:
      type: group
      logicalOperator: And
      children:
        - type: provider
          operator: Equals
          expectedProvider: openai
        - type: endpoint
          operator: Equals
          expectedEndpoint: chat_completions
    actions:
      - type: addTag
        tag: surface:openai-chat
    behavior: continue

  - name: tag-anthropic-messages
    condition:
      type: group
      logicalOperator: And
      children:
        - type: provider
          operator: Equals
          expectedProvider: anthropic
        - type: endpoint
          operator: Equals
          expectedEndpoint: messages
    actions:
      - type: addTag
        tag: surface:anthropic-messages
    behavior: continue

  - name: tag-large-prompt
    condition:
      type: header
      keyOperator: Equals
      keyPattern: x-sluice-tag-large
      valueOperator: Equals
      valuePattern: "true"
      caseInsensitive: true
    actions:
      - type: addTag
        tag: audit:large-prompt
    behavior: continue

  - name: redact-emails
    condition:
      type: provider
      operator: Equals
      expectedProvider: openai
    actions:
      - type: setHeader
        headerName: X-Sluice-Redacted
        headerAction: Set
        headerValue: emails
    behavior: continue

  - name: route-gpt-oss
    condition:
      type: modelName
      operator: StartsWith
      expectedModelName: gpt-oss
    actions:
      - type: changeProvider
        newProvider: gpt-oss
    behavior: continue

  - name: route-qwen36
    condition:
      type: modelName
      operator: StartsWith
      expectedModelName: "qwen3.6"
    actions:
      - type: changeProvider
        newProvider: qwen36
    behavior: continue

  - name: route-qwen-ollama
    condition:
      type: modelName
      operator: Equals
      expectedModelName: "qwen2.5-coder:7b"
    actions:
      - type: changeProvider
        newProvider: qwen-ollama
    behavior: continue

  - name: route-claude-models-to-anthropic
    condition:
      type: modelName
      operator: StartsWith
      expectedModelName: claude-
    actions:
      - type: changeProvider
        newProvider: anthropic
    behavior: continue

  - name: route-gemini-models-to-gemini
    condition:
      type: modelName
      operator: StartsWith
      expectedModelName: gemini-
    actions:
      - type: changeProvider
        newProvider: gemini
    behavior: continue

resilience_policies:
  - name: high-availability
    mode: failover
    timeout_seconds: 30
    targets:
      - provider: openai
        order: 0
      - provider: anthropic
        order: 1
