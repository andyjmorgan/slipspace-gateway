providers:
  openai:
    prefix: openai
    prefix_required: false
    base_url: http://mockllm:5555
    endpoints:
      chat_completions:
        path: /v1/chat/completions
        method: [POST]
        accepted_paths: [/v1/chat/completions, /chat/completions]
        accepts_streaming: true
        request_kind: chat
      responses:
        path: /v1/responses
        method: [POST]
        accepted_paths: [/v1/responses]
        accepts_streaming: true
        request_kind: responses
      models:
        path: /v1/models
        method: [GET]
        accepted_paths: [/v1/models, /models]
        request_kind: passthrough

  anthropic:
    prefix: anthropic
    prefix_required: true
    base_url: http://mockllm:5555
    required_headers:
      anthropic-version: "2023-06-01"
    endpoints:
      messages:
        path: /v1/messages
        method: [POST]
        accepted_paths: [/v1/messages, /messages]
        accepts_streaming: true
        request_kind: messages
        prefix_optional: true
        auth_header: x-api-key
        auth_format: "{key}"
      models:
        path: /v1/models
        method: [GET]
        accepted_paths: [/v1/models]
        request_kind: passthrough
      chat_completions:
        path: /v1/chat/completions
        method: [POST]
        accepted_paths: [/v1/chat/completions]
        accepts_streaming: true
        request_kind: chat
        auth_header: Authorization
        auth_format: "Bearer {key}"

  gemini:
    prefix: gemini
    prefix_required: true
    base_url: http://mockllm:5555
    endpoints:
      generate_content:
        method: [POST]
        accepted_paths:
          - /v1beta/models/{model}:generateContent
          - /v1beta/models/{model}:streamGenerateContent
        accepts_streaming: true
        request_kind: generate_content
        prefix_optional: true
      models:
        path: /v1beta/models
        method: [GET]
        accepted_paths: [/v1beta/models]
        request_kind: passthrough
      chat_completions:
        path: /v1beta/openai/chat/completions
        method: [POST]
        accepted_paths: [/v1beta/openai/chat/completions]
        accepts_streaming: true
        request_kind: chat
        auth_header: Authorization
        auth_format: "Bearer {key}"

  gpt-oss:
    prefix: gpt-oss
    prefix_required: true
    base_url: http://mockllm:5555
    endpoints:
      chat_completions:
        path: /v1/chat/completions
        method: [POST]
        accepted_paths: [/v1/chat/completions]
        accepts_streaming: true
        request_kind: chat
      responses:
        path: /v1/responses
        method: [POST]
        accepted_paths: [/v1/responses]
        accepts_streaming: true
        request_kind: responses
      messages:
        path: /v1/messages
        method: [POST]
        accepted_paths: [/v1/messages]
        accepts_streaming: true
        request_kind: messages
      models:
        path: /v1/models
        method: [GET]
        accepted_paths: [/v1/models]
        request_kind: passthrough

  qwen36:
    prefix: qwen36
    prefix_required: true
    base_url: http://mockllm:5555
    endpoints:
      chat_completions:
        path: /v1/chat/completions
        method: [POST]
        accepted_paths: [/v1/chat/completions]
        accepts_streaming: true
        request_kind: chat
      responses:
        path: /v1/responses
        method: [POST]
        accepted_paths: [/v1/responses]
        accepts_streaming: true
        request_kind: responses
      messages:
        path: /v1/messages
        method: [POST]
        accepted_paths: [/v1/messages]
        accepts_streaming: true
        request_kind: messages
      models:
        path: /v1/models
        method: [GET]
        accepted_paths: [/v1/models]
        request_kind: passthrough

  qwen-ollama:
    prefix: qwen-ollama
    prefix_required: true
    base_url: http://mockllm:5555
    endpoints:
      chat_completions:
        path: /v1/chat/completions
        method: [POST]
        accepted_paths: [/v1/chat/completions]
        accepts_streaming: true
        request_kind: chat
      messages:
        path: /v1/messages
        method: [POST]
        accepted_paths: [/v1/messages]
        accepts_streaming: true
        request_kind: messages
