name: release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

# Serialize releases on the same ref so concurrent merges to main can't
# race the floating `:main` tag. Without this, if two PRs land within
# the same release-job window, both push `:main` and whichever finishes
# last wins — even if it built an older commit (which can happen when
# the later commit's CI flakes and retries). cancel-in-progress is
# deliberately false: we want every sha-pinned tag to survive, and
# last-writer-wins is correct when runs execute sequentially in merge
# order. Each ref gets its own group, so branch and tag releases don't
# block each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: [self-hosted, office-cluster]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: slipspace-gateway
            dockerfile: deploy/docker/Dockerfile
          - name: slipspace-mockllm
            dockerfile: deploy/docker/Dockerfile.mockllm
          - name: arbiter
            dockerfile: deploy/docker/Dockerfile.arbiter
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe needs the full history + tags to resolve the
          # most recent tag and the commit distance from it. Without
          # fetch-depth: 0 we'd see e.g. "abc1234" instead of
          # "v1.1.4-3-gabc1234" on untagged main builds.
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3

      # The office-cluster runner pod ships a buildkitd.toml at
      # /home/runner/.config/buildkit/ that points docker.io at the
      # cluster-internal pull-through mirror. setup-buildx-action
      # doesn't pick up BUILDKIT_CONFIG from the environment — the
      # mirror config has to be passed explicitly here, otherwise
      # buildx talks straight to docker.io and the cluster's NAT IP
      # hits the anonymous-pull rate limit on every release.
      - uses: docker/setup-buildx-action@v3
        with:
          config: /home/runner/.config/buildkit/buildkitd.toml

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute the build-time version string baked into the binary
      # via -ldflags. For tagged release builds this is just the tag
      # (v1.1.4); for main pushes between tags it's the standard Go
      # `git describe` shape "v1.1.4-3-gabc1234" — last tag, commits
      # past it, short SHA — so /admin/api/v1/version reports exactly
      # which build is running, not just "the latest tag I happen to
      # share a digest with".
      - id: version
        name: Compute build version
        run: echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          # type=sha gives every commit on main a permanent, pull-able
          # tag like `:sha-abc1234` so a Deployment can pin to a
          # specific build without waiting for a semver tag cut.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Also move `:latest` on every default-branch (main) push, not
            # just on v-tags. An image added to the matrix after the last
            # semver tag (arbiter, added in #234) otherwise never
            # gets a `:latest` until the next release is cut, even though it
            # builds on every main push. This mirrors the floating `:main`
            # tag from `type=ref,event=branch`; sha-pinned tags remain the
            # source of truth that Deployments pin to.
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mark package public
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          gh api --method PATCH \
            "/user/packages/container/${{ matrix.name }}" \
            -f visibility=public

  release:
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, office-cluster]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update GitHub Release
        # Idempotent on tag re-push: gh release create fails with HTTP 422
        # if the release already exists (very common when a tag is
        # force-moved during an in-progress release cycle). Pre-check with
        # `gh release view`; if present, swap to `gh release edit` so the
        # workflow stays green and the release notes get refreshed to the
        # current commit's content.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ github.ref_name }}"
          stripped="${version#v}"
          cat > /tmp/release-notes.md <<EOF
          sluice-gateway ${version} — observable AI provider gateway.

          ## Images

          linux/amd64, scratch base, ~5.5 MB.

          \`\`\`
          docker pull ghcr.io/${{ github.repository_owner }}/slipspace-gateway:${stripped}
          docker pull ghcr.io/${{ github.repository_owner }}/slipspace-mockllm:${stripped}
          docker pull ghcr.io/${{ github.repository_owner }}/arbiter:${stripped}
          \`\`\`

          ## Quick run

          \`\`\`
          docker run --rm \\
            -e SLUICE_CONFIG_DIR=/etc/sluice \\
            -e SLUICE_SPOOL_ROOT=/var/lib/sluice/spool \\
            -v ./config-dev:/etc/sluice:ro \\
            -v sluice-spool:/var/lib/sluice/spool \\
            -p 8585:8585 \\
            ghcr.io/${{ github.repository_owner }}/slipspace-gateway:${stripped}
          \`\`\`

          Minimal production env: \`SLUICE_CONFIG_DIR\` plus optionally \`SLUICE_SPOOL_ROOT\` (where the connector spool lives — defaults to \`/var/lib/sluice/spool\`) and \`SLUICE_OTLP_ENDPOINT\` (enables OTLP push). See \`CLAUDE.md\` for the full deployment shape.

          See \`CLAUDE.md\` and the project's DonkeyWork design notes for load-bearing invariants, the per-release task ledger, and the v1.1 roadmap.
          EOF

          if gh release view "${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${version} already exists; updating notes in place"
            gh release edit "${version}" \
              --title "sluice-gateway ${version}" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "${version}" \
              --title "sluice-gateway ${version}" \
              --notes-file /tmp/release-notes.md
          fi
