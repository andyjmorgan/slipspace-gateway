name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, office-cluster]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true
      - run: go mod download
      - run: go build ./...

  vet:
    runs-on: [self-hosted, office-cluster]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true
      - run: go vet ./...

  lint:
    runs-on: [self-hosted, office-cluster]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    runs-on: [self-hosted, office-cluster]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true
      # Inline the steps `make coverage` runs — the office-cluster
      # runner image is minimal and doesn't ship `make`. Keeps the
      # Makefile as the local dev entry point without coupling CI to
      # whatever ships in /usr/bin.
      - name: go test with coverage
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic \
            $(go list ./... | grep -v 'web/node_modules')
      - name: coverage gate
        run: bash scripts/coverage-gate.sh
      # The coverage gate ran above; the artifact is just for browsing the
      # .out file. Tolerate upload failures (e.g. transient GH Actions
      # artifact-storage-quota errors) so they don't fail the job.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  e2e:
    runs-on: [self-hosted, office-cluster]
    env:
      # Ryuk (testcontainers' reaper container) is flaky on ephemeral
      # CI runners and not needed when the runner itself disposes of
      # the workspace. Disabling keeps the suite reliable.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true
      # Inline equivalent of `make e2e` (the runner image is minimal —
      # no `make`). The runner pod shares one network namespace, so
      # any port-races in the harness's bind-on-zero-then-close-and-
      # reopen pattern surface as flakes. Both knobs needed:
      #   -p 1         — one package at a time (between packages)
      #   -parallel=1  — one t.Parallel() test at a time (within a package)
      # Full serial; trades wall-clock for reliability until the
      # harness binds directly on :0 without the close-and-reopen
      # round-trip that creates the TOCTOU window.
      - name: go test e2e
        run: go test -tags=e2e -race -count=1 -p 1 -parallel 1 -timeout=15m ./test/e2e/...
