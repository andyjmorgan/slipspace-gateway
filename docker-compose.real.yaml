# Overlay onto docker-compose.yaml that swaps the mock LLM upstream for
# real provider APIs (OpenAI/Anthropic/Gemini + qwen-ollama via a host
# port-forward).
#
# Usage (via `make dev-real`):
#   bash scripts/dev-real-config.sh
#   kubectl --context=office port-forward -n ollama-qwen36 svc/ollama 11434:11434 &
#   docker compose -f docker-compose.yaml -f docker-compose.real.yaml up -d --no-deps gateway nats
#
# Only nats is brought up alongside the gateway. The base compose's
# mockllm service is unused in this mode; --no-deps prevents the
# gateway service from pulling it into the up set via depends_on.

services:
  gateway:
    # Drop the mock LLM from depends_on — real mode reaches OpenAI /
    # Anthropic / Gemini directly. nats stays so reporting still flows.
    depends_on:
      - nats
    # Reach the host's port-forwarded ollama on macOS / Windows Docker
    # Desktop. extra_hosts with host-gateway resolves on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Replace the mock-pointed config-dev mount with the real-upstream
      # generated tree.
      - ./config-dev.real:/etc/sluice:ro
