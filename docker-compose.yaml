services:
  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: sluice-gateway:dev
    ports:
      - "8585:8585"  # data plane
      - "8081:8081"  # admin console (SPA + /api/v1)
      - "9090:9090"  # prometheus scrape
    environment:
      SLUICE_CONFIG_DIR: /etc/sluice
      SLUICE_HTTP_BIND: 0.0.0.0:8585
      SLUICE_SHUTDOWN_DRAIN_SECONDS: "300"
      SLUICE_LOG_FORMAT: json
      SLUICE_LOG_LEVEL: debug
      SLUICE_PROMETHEUS_BIND: 0.0.0.0:9090
      SLUICE_SPOOL_ROOT: /var/lib/sluice/spool
      # Operator credential for the admin console. Wins over any
      # `password:` field in admin.yaml. Override per developer.
      SLUICE_ADMIN_PASSWORD: ${SLUICE_ADMIN_PASSWORD:-sluice-gateway}
      # Tight snapshot cadence so the dashboard reflects local traffic
      # within seconds; production defaults to 300000 (5 minutes).
      SLUICE_ADMIN_SNAPSHOT_INTERVAL_MS: ${SLUICE_ADMIN_SNAPSHOT_INTERVAL_MS:-2000}
    volumes:
      - ./config-dev:/etc/sluice:ro
      # Overlay the host config-dev/admin.yaml (binds loopback for native
      # go-run) with one that binds 0.0.0.0 so the host port mapping
      # reaches the listener.
      - ./deploy/compose/admin.yaml:/etc/sluice/admin.yaml:ro
      # Spool root. Survives container restarts; for production deploy
      # this maps to a PVC.
      - sluice-spool:/var/lib/sluice/spool
    depends_on:
      - mockllm

  mockllm:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.mockllm
    image: sluice-mockllm:dev
    # No host port mapping — the gateway reaches mockllm via the
    # compose network alias `mockllm:5555`. Uncomment the ports block
    # if you want to curl the mock LLM directly from the host.
    # ports:
    #   - "5555:5555"

volumes:
  sluice-spool:
