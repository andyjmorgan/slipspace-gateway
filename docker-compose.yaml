services:
  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: sluice-gateway:dev
    ports:
      - "8585:8585"
      - "9090:9090"
    environment:
      SLUICE_CONFIG_DIR: /etc/sluice
      LOG_LEVEL: debug
    volumes:
      - ./config-dev:/etc/sluice:ro
    depends_on:
      - mockllm
      - nats

  mockllm:
    image: ghcr.io/andyjmorgan/sluice-mockllm:latest
    ports:
      - "5555:5555"

  nats:
    image: nats:2.10
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"
