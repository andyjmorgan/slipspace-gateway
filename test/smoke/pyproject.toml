[project]
name = "sluice-gateway-smoke"
version = "0.0.1"
description = "Post-deploy smoke suite that drives the real OpenAI / Anthropic / Gemini SDKs against a live sluice-gateway."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "google-genai>=0.5.0",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
timeout = 60
addopts = "-v --tb=short"
testpaths = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
