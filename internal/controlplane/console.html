<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sluice — Fleet</title>
<style>
  :root {
    --bg: #0b0e14; --bg-1: #11151f; --border: #1f2633;
    --text: #e6eaf2; --text-3: #8b95a7; --accent: #60a5fa;
    --online: #4ade80; --stale: #facc15; --offline: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 20px 24px; border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: -0.02em; }
  header .sub { color: var(--text-3); font-size: 12.5px; }
  header .spacer { flex: 1; }
  #updated { color: var(--text-3); font-size: 12px; }
  main { padding: 24px; }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border);
    font-size: 13px; white-space: nowrap;
  }
  th { color: var(--text-3); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  td.id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .online  .dot { background: var(--online); }  .online  { color: var(--online); }
  .stale   .dot { background: var(--stale); }   .stale   { color: var(--stale); }
  .offline .dot { background: var(--offline); } .offline { color: var(--offline); }
  .labels { color: var(--text-3); font-size: 12px; }
  .empty, .error {
    padding: 48px; text-align: center; color: var(--text-3);
    border: 1px solid var(--border); border-radius: 10px; background: var(--bg-1);
  }
  .error { color: var(--offline); }
</style>
</head>
<body>
  <header>
    <h1>Fleet</h1>
    <span class="sub">Sluice control plane</span>
    <span class="spacer"></span>
    <span id="updated"></span>
  </header>
  <main><div id="view"><div class="empty">Loading…</div></div></main>

<script>
const REFRESH_MS = 5000;
const view = document.getElementById("view");
const updated = document.getElementById("updated");

function rel(iso) {
  if (!iso) return "—";
  const t = new Date(iso).getTime();
  if (isNaN(t)) return iso;
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  return Math.round(s / 3600) + "h ago";
}

function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function labels(obj) {
  if (!obj) return "";
  return Object.keys(obj).sort().map(k => esc(k) + "=" + esc(obj[k])).join(", ");
}

function render(rows) {
  if (!rows.length) {
    view.innerHTML = '<div class="empty">No gateways registered yet.</div>';
    return;
  }
  const body = rows.map(g => `
    <tr>
      <td class="id">${esc(g.id)}</td>
      <td><span class="badge ${esc(g.status)}"><span class="dot"></span>${esc(g.status)}</span></td>
      <td>${esc(g.version)}</td>
      <td class="labels">${labels(g.labels) || "—"}</td>
      <td>${rel(g.last_seen)}</td>
      <td>${rel(g.registered_at)}</td>
    </tr>`).join("");
  view.innerHTML = `
    <table>
      <thead><tr>
        <th>Gateway</th><th>Status</th><th>Version</th><th>Labels</th><th>Last seen</th><th>Registered</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>`;
}

async function poll() {
  try {
    const res = await fetch("/api/v1/fleet", { headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = await res.json();
    render(Array.isArray(rows) ? rows : []);
    updated.textContent = "updated " + new Date().toLocaleTimeString();
  } catch (e) {
    view.innerHTML = '<div class="error">Failed to load fleet: ' + esc(e.message) + '</div>';
  }
}

poll();
setInterval(poll, REFRESH_MS);
</script>
</body>
</html>
