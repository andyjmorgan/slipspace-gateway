# Central telemetry service stack: Postgres + the telemetry binary. Built and
# run independently of the gateway (docker-compose.yaml). Gateways feed this
# service over OTLP (8687) and the HMAC webhook (8686); they are not part of
# this compose file.
#
#   docker compose -f docker-compose.telemetry.yaml up --build
#
# Before first run, set a real console password hash in
# deploy/compose/telemetry.yaml (see the comment there) and a per-gateway HMAC
# secret. The SPA + API are on :8686, OTLP gRPC on :8687.
services:
  telemetry-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: telemetry
    volumes:
      - telemetry-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry"]
      interval: 5s
      timeout: 3s
      retries: 10

  telemetry:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.telemetry
    image: sluice-telemetry:dev
    ports:
      - "8686:8686" # console + webhook ingest
      - "8687:8687" # OTLP gRPC
    volumes:
      - ./deploy/compose/telemetry.yaml:/etc/sluice/telemetry.yaml:ro
    depends_on:
      telemetry-db:
        condition: service_healthy

volumes:
  telemetry-pg:
