# Quickstart stack 3 — gateway + the Arbiter service (+ Postgres).
#
#   cp .env.example .env      # then edit in your provider keys
#   docker compose -f compose.arbiter.yaml up -d --wait
#
# Data plane:        http://localhost:8585  (point your SDK base URL here)
# Gateway console:   http://localhost:8081  (admin / $SLIPSPACE_ADMIN_PASSWORD)
# Arbiter console: http://localhost:8686  (admin / "arbiter" default)
#
# The gateway pushes gen_ai spans + slipspace meters to the Arbiter over
# OTLP gRPC (:8687); the Arbiter console aggregates them across requests. This
# is the OTLP feed only — to also ship the full per-request Record (bodies,
# headers, rule chain) for the message inspector, see "Full Record feed" in
# README.md.
#
# Pulls published images from GHCR. See README.md for the full guide.
name: slipspace-quickstart

services:
  init:
    image: alpine:3
    env_file: .env
    volumes:
      - ./config:/in:ro
      - slipspace-config:/out
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache gettext >/dev/null
        rm -f /out/*.yaml
        cp "/in/$${PROVIDERS_FILE:-providers.yaml}" /out/providers.yaml
        cp /in/admin.yaml /out/admin.yaml
        envsubst '$$OPENAI_API_KEY $$ANTHROPIC_API_KEY $$GEMINI_API_KEY $$SLIPSPACE_CLIENT_API_KEY' \
          < /in/policy.template.yaml > /out/policy.yaml
        echo "rendered /etc/slipspace: $$(ls /out)"

  gateway:
    image: ghcr.io/andyjmorgan/slipspace-gateway:${SLIPSPACE_IMAGE_TAG:-latest}
    env_file: .env
    environment:
      SLIPSPACE_CONFIG_DIR: /etc/slipspace
      SLIPSPACE_HTTP_BIND: 0.0.0.0:8585
      SLIPSPACE_SPOOL_ROOT: /var/lib/slipspace/spool
      SLIPSPACE_LOG_FORMAT: json
      SLIPSPACE_LOG_LEVEL: ${SLIPSPACE_LOG_LEVEL:-info}
      SLIPSPACE_ADMIN_PASSWORD: ${SLIPSPACE_ADMIN_PASSWORD:-slipspace-gateway}
      # Push the gen_ai + slipspace telemetry feeds to the Arbiter.
      SLIPSPACE_OTLP_ENDPOINT: arbiter:8687
      SLIPSPACE_OTLP_PROTOCOL: grpc
      SLIPSPACE_ENV: quickstart
    ports:
      - "8585:8585"
      - "8081:8081"
    volumes:
      - slipspace-config:/etc/slipspace:ro
      - slipspace-spool:/var/lib/slipspace/spool
    depends_on:
      init:
        condition: service_completed_successfully
      arbiter:
        condition: service_started
    restart: unless-stopped

  arbiter-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: telemetry
    volumes:
      - arbiter-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  arbiter:
    image: ghcr.io/andyjmorgan/slipspace-arbiter:${SLIPSPACE_IMAGE_TAG:-latest}
    ports:
      - "8686:8686" # console + Record webhook ingest
      - "8687:8687" # OTLP gRPC
    volumes:
      - ./config/arbiter.yaml:/etc/slipspace/arbiter.yaml:ro
    depends_on:
      arbiter-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  slipspace-config:
  slipspace-spool:
  arbiter-pg:
