# Quickstart stack 2 — gateway only, NO admin console (pure data plane).
#
#   cp .env.example .env      # then edit in your provider keys
#   docker compose -f compose.minimal.yaml up -d --wait
#
# Data plane: http://localhost:8585   (point your SDK base URL here)
# No admin console — admin.yaml is not staged, so the console stays disabled.
#
# Pulls published images from GHCR. See README.md for the full guide.
name: sluice-quickstart

services:
  init:
    image: alpine:3
    env_file: .env
    volumes:
      - ./config:/in:ro
      - sluice-config:/out
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache gettext >/dev/null
        rm -f /out/*.yaml
        cp "/in/$${PROVIDERS_FILE:-providers.yaml}" /out/providers.yaml
        envsubst '$$OPENAI_API_KEY $$ANTHROPIC_API_KEY $$GEMINI_API_KEY $$SLUICE_CLIENT_API_KEY' \
          < /in/policy.template.yaml > /out/policy.yaml
        echo "rendered /etc/sluice: $$(ls /out)"

  gateway:
    image: ghcr.io/andyjmorgan/sluice-gateway:${SLUICE_IMAGE_TAG:-latest}
    env_file: .env
    environment:
      SLUICE_CONFIG_DIR: /etc/sluice
      SLUICE_HTTP_BIND: 0.0.0.0:8585
      SLUICE_SPOOL_ROOT: /var/lib/sluice/spool
      SLUICE_LOG_FORMAT: json
      SLUICE_LOG_LEVEL: ${SLUICE_LOG_LEVEL:-info}
    ports:
      - "8585:8585" # data plane only
    volumes:
      - sluice-config:/etc/sluice:ro
      - sluice-spool:/var/lib/sluice/spool
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  sluice-config:
  sluice-spool:
