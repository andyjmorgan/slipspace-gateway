# Quickstart Arbiter service config (used by compose.arbiter.yaml).
# Mounted at /etc/sluice/arbiter.yaml. File contents are trusted — there is no
# ${VAR} interpolation here (unlike the gateway's policy template), so the
# console password hash and DSN are literal.

# Console + HMAC Record-webhook ingest listener.
http_bind: "0.0.0.0:8686"
# OTLP gRPC listener — the gateway pushes gen_ai spans + sluice meters here.
otlp_bind: "0.0.0.0:8687"

# Per-request cap (bytes) on the gen_ai content the OTLP ingest keeps for the
# console. Content is a best-effort console aid — the audit copy travels the
# Record feed. 0 disables the cap; unbounded content makes the console's
# memory profile a function of the largest session, so keep a bound in place.
content_max_bytes: 65536

# Per-field cap (bytes) the session-spans projection applies to served content
# (text / tool args / input_text / output_text). The *_chars fields keep the
# true sizes so the console's "showing first N of M" notice stays accurate.
# Omit to take the default (65536); 0 disables the cap.
span_field_max_bytes: 65536

postgres:
  # Matches the arbiter-db service in compose.arbiter.yaml.
  dsn: "postgres://telemetry:telemetry@arbiter-db:5432/telemetry?sslmode=disable"

console:
  username: "admin"
  # bcrypt hash of the default console password "arbiter".
  # CHANGE THIS before exposing the console. Regenerate with:
  #   htpasswd -bnBC 10 "" 'your-password' | tr -d ':\n' | sed 's/^\$2y/\$2a/'
  password_hash: "$2a$10$sMpXqqNSXbtRbzPQhdFVZO4Ssm6zxGubZqDvDSCuTPpNxG8kWcz.G"

# Registered gateways permitted to push the HMAC Record webhook (channel 3).
# Empty by default: the quickstart wires the gateway -> telemetry link over OTLP
# only, which needs no registration. To enable the full Record/audit feed, add
# an entry here whose id + hmac_secret match the gateway's connector config and
# SLUICE_TELEMETRY_HMAC_SECRET — see the bundle README ("Full Record feed").
gateways: []
