# Quickstart providers — the real upstream connections.
#
# Providers are connections only (base_url + per-protocol paths + auth
# conventions). They carry NO credentials — the configuration in policy.yaml
# supplies the key per provider. This file is static; nothing here is templated.
#
# The per-protocol auth header/format is what each real provider expects:
#   - openai:    Authorization: Bearer <key>
#   - anthropic: x-api-key: <key>            (native messages)
#                Authorization: Bearer <key> (openai-compat chat surface)
#   - gemini:    x-goog-api-key: <key>       (native generate_content)
#                Authorization: Bearer <key> (openai-compat chat surface)

providers:
  openai:
    base_url: https://api.openai.com
    protocols:
      chat:
        path: /v1/chat/completions
        auth:
          header: Authorization
          format: "Bearer {key}"
      responses:
        path: /v1/responses
        auth:
          header: Authorization
          format: "Bearer {key}"
    passthrough:
      models:
        auth:
          header: Authorization
          format: "Bearer {key}"
        paths:
          - match: /v1/models
            methods: [GET]

  anthropic:
    base_url: https://api.anthropic.com
    required_headers:
      anthropic-version: "2023-06-01"
    protocols:
      messages:
        path: /v1/messages
        auth:
          header: x-api-key
          format: "{key}"
      chat:
        path: /v1/chat/completions
        auth:
          header: Authorization
          format: "Bearer {key}"
    # No messages_batches passthrough — batches are intentionally not bound in
    # the quickstart configuration.

  gemini:
    base_url: https://generativelanguage.googleapis.com
    protocols:
      generate_content:
        path: "/v1beta/models/{model}:{op}"
        auth:
          header: x-goog-api-key
          format: "{key}"
      chat:
        path: /v1beta/openai/chat/completions
        auth:
          header: Authorization
          format: "Bearer {key}"
    passthrough:
      models:
        auth:
          header: x-goog-api-key
          format: "{key}"
        paths:
          - match: /v1beta/models
            methods: [GET]
