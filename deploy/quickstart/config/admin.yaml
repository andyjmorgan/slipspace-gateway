# Quickstart admin console config. Copied into the rendered config volume by
# the init service ONLY for the admin and telemetry stacks; the minimal stack
# omits it, so the console stays off (admin defaults to disabled when no
# admin.yaml is present in the config dir).
#
# Binds 0.0.0.0 so the compose host port mapping reaches the listener.
# Username is always "admin". The password comes from SLUICE_ADMIN_PASSWORD
# (set in .env, exported by the compose file) which wins over the field below;
# the placeholder here only keeps config validation happy.
admin:
  enabled: true
  bind_addr: "0.0.0.0:8081"
  password: "placeholder-overridden-by-SLUICE_ADMIN_PASSWORD"
